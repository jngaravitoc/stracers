# Run the test suite on every push and pull request, on the oldest and newest
# supported Python and NumPy. The tests that need simulation data
# (tests/test_simulation.py) are skipped here.

name: Tests

on:
  push:
    branches: [ "master" ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.9"
            numpy: "numpy<2"
          - python-version: "3.12"
            numpy: "numpy>=2"
    name: Python ${{ matrix.python-version }}, ${{ matrix.numpy }}
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install stracers with the test and plot extras
      run: |
        python -m pip install --upgrade pip
        python -m pip install ".[test,plot]" "${{ matrix.numpy }}"
        python -c "import numpy, scipy; print('numpy', numpy.__version__, 'scipy', scipy.__version__)"
    - name: Run the tests
      run: |
        python -m pytest -ra
